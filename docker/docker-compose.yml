version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: todo-chatbot-db
    environment:
      POSTGRES_DB: todo_chatbot_dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d todo_chatbot_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: todo-chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/todo_chatbot_dev
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../backend:/app/backend

  # MCP Server
  mcp-server:
    build:
      context: ../../mcp_server
      dockerfile: Dockerfile
    container_name: todo-chatbot-mcp-server
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/todo_chatbot_dev
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../mcp_server:/app/mcp_server

  # Frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: todo-chatbot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ../../frontend:/app/frontend

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: todo-chatbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data: